services:
  - type: web
    name: yandex-map-reviews-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /up

  - type: worker
    name: yandex-map-reviews-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    dockerCommand: php artisan queue:work database --sleep=3 --tries=3 --backoff=30,120,300 --timeout=600