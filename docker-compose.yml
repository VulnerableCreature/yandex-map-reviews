services:
  app:
    build:
      context: ./backend
    environment:
      PHP_IDE_CONFIG: "serverName=Docker"
    volumes:
      - ./backend:/var/www
    env_file:
      - ./backend/.env
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  queue-worker:
    build:
      context: ./backend
    command: php artisan queue:work --tries=3 --timeout=600
    environment:
      PHP_IDE_CONFIG: "serverName=Docker"
    volumes:
      - ./backend:/var/www
    env_file:
      - ./backend/.env
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - nginx

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: yandex_reviews
      MYSQL_USER: yandex_reviews
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mysql_data:
